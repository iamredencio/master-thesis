name: Courtline model and frontend quality
on:
  push:
    branches: [master]
    paths: ['career-intelligence/**', '.github/workflows/courtline.yml']
  pull_request:
    paths: ['career-intelligence/**', '.github/workflows/courtline.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r career-intelligence/ml/requirements.txt
      - run: python career-intelligence/ml/train.py --check
      - run: python career-intelligence/ml/draft_path.py --check
      - run: python -m unittest discover -s career-intelligence/ml/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check career-intelligence/web/app.js
      - run: node --check career-intelligence/web/api/live.js
      - run: node --check career-intelligence/web/api/health.js
      - run: node --check career-intelligence/web/api/scout.js
      - run: node --check career-intelligence/web/scouting.js
